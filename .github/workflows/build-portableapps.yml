name: Build UniGetUI PortableApps (x64)

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: 'Stable version (e.g. 2026.3.3); blank = newest stable release'
        required: false
        type: string
        default: ''
      build_method:
        description: 'release-zip = checksum-verified official upstream build; source-compile = experimental full upstream NativeAOT build'
        type: choice
        required: true
        default: release-zip
        options:
          - release-zip
          - source-compile

permissions:
  contents: write

concurrency:
  group: unigetui-portableapps-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 110
    steps:
      - name: Checkout independent builder
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify pinned shared action contracts
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/verify-actions.ps1

      - name: Fast independent ZIP safety fixture tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Python ZIP and workflow fixture tests failed.' }

      - name: Offline stable-release resolver regression tests
        shell: pwsh
        run: ./tests/test-release-policy.ps1

      - name: Offline PortableApps root Data scope regression tests
        shell: pwsh
        run: ./tests/test-stage-data-scope.ps1

      - name: Resolve stable release, upstream checksum and actual source commit
        id: upstream
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.upstream_version }}
        run: ./scripts/resolve.ps1 -Version $env:REQUESTED_VERSION -BuilderRevision b6 -PackageRevision r1

      - name: Set up .NET 10 for compiled NativeAOT launcher
        if: steps.upstream.outputs.skip != 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download and verify original upstream binary, or compile tagged source
        if: steps.upstream.outputs.skip != 'true'
        shell: pwsh
        env:
          BUILD_METHOD: ${{ inputs.build_method }}
        run: ./scripts/build-stage.ps1 -Method $env:BUILD_METHOD -BuilderRevision b6

      - name: Run isolated, non-GUI Windows TraceGuard tests
        if: steps.upstream.outputs.skip != 'true'
        shell: pwsh
        timeout-minutes: 3
        run: |
          # UniGetUIPortable.exe is a Windows GUI-subsystem (WinExe) application.
          # Direct invocation with & does not reliably populate $LASTEXITCODE.
          # Wait for the real Windows process and inspect its actual ExitCode.
          $exe = (Resolve-Path -LiteralPath 'work/UniGetUIPortable/UniGetUIPortable.exe').Path
          $probe = Start-Process -FilePath $exe -ArgumentList '--traceguard-exit-probe' -NoNewWindow -PassThru -Wait
          if ($null -eq $probe -or $null -eq $probe.ExitCode -or $probe.ExitCode -ne 7) {
            throw "GUI launcher exit-code probe failed. Expected 7; actual: $($probe.ExitCode)"
          }
          $test = Start-Process -FilePath $exe -ArgumentList '--traceguard-self-test' -NoNewWindow -PassThru -Wait
          if ($null -eq $test -or $null -eq $test.ExitCode -or $test.ExitCode -ne 0) {
            throw "Native launcher TraceGuard tests failed. Expected 0; actual: $($test.ExitCode)"
          }
          $powershellTest = Start-Process -FilePath $exe -ArgumentList '--traceguard-powershell-self-test' -NoNewWindow -PassThru -Wait
          if ($null -eq $powershellTest -or $null -eq $powershellTest.ExitCode -or $powershellTest.ExitCode -ne 0) {
            throw "Scoped PowerShell TraceGuard tests failed. Expected 0; actual: $($powershellTest.ExitCode)"
          }
          Write-Host 'PASS: Windows GUI launcher exit codes, baseline TraceGuard, isolated shared PowerShell trace tests.'

      - name: Validate staged genuine Windows launcher and AppInfo
        if: steps.upstream.outputs.skip != 'true'
        shell: pwsh
        run: ./scripts/validate-stage.ps1

      - name: Create and validate independent PortableApps ZIP
        if: steps.upstream.outputs.skip != 'true'
        shell: pwsh
        env:
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
        run: python scripts/package_zip.py work/UniGetUIPortable "dist/UniGetUIPortable_$($env:UPSTREAM_VERSION)_b6.zip"

      - name: Build separate independent NSIS installer via shared packager
        if: steps.upstream.outputs.skip != 'true'
        id: packager
        uses: vhick/Portable-Package-Builder@v1.0.0
        with:
          source-dir: work/UniGetUIPortable
          output-dir: dist
          engine: custom-nsis
          running-exe: 'App\UniGetUI\UniGetUI.exe'
          package-revision: r1
          timeout-seconds: '900'

      - name: Verify installer output, checksum and independent NSIS provenance
        if: steps.upstream.outputs.skip != 'true'
        shell: pwsh
        env:
          INSTALLER: ${{ steps.packager.outputs.installer-file }}
          INSTALLER_SHA256: ${{ steps.packager.outputs.installer-sha256 }}
        run: ./scripts/validate-installer.ps1 -Installer $env:INSTALLER -Sha256 $env:INSTALLER_SHA256

      - name: Publisher dry-run checks ZIP and installer
        if: steps.upstream.outputs.skip != 'true'
        uses: vhick/portable-release-publisher@v1.1.1
        with:
          files: |
            dist/*.zip
            dist/*.paf.exe
          tag: ${{ steps.upstream.outputs.release_tag }}
          release-title: 'UniGetUI PortableApps ${{ steps.upstream.outputs.version }} (builder b6, independent NSIS r1)'
          keep-releases: '3'
          prune: 'false'
          dry-run: 'true'

      - name: Publish validated packages to this repository
        if: steps.upstream.outputs.skip != 'true'
        uses: vhick/portable-release-publisher@v1.1.1
        with:
          files: |
            dist/*.zip
            dist/*.paf.exe
          tag: ${{ steps.upstream.outputs.release_tag }}
          release-title: 'UniGetUI PortableApps ${{ steps.upstream.outputs.version }} (builder b6, independent NSIS r1)'
          keep-releases: '3'
          prune: 'false'
          dry-run: 'false'

      - name: Build summary
        if: always()
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.upstream.outputs.release_tag }}
          SKIP: ${{ steps.upstream.outputs.skip }}
        run: |
          if ($env:SKIP -eq 'true') { "Existing validated release: $env:RELEASE_TAG. No rebuild needed." >> $env:GITHUB_STEP_SUMMARY }
          elseif ($env:RELEASE_TAG) { "Build release tag: $env:RELEASE_TAG. Check earlier steps for actual validation and publish status." >> $env:GITHUB_STEP_SUMMARY }
